name: Scrape Menus and Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Rebuild once per day, offset from the top of the hour since GitHub
    # deprioritizes/drops scheduled runs that land exactly on the hour
    - cron: "13 5 * * *"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Scrape restaurant menus
        working-directory: backend
        run: python generate_static_data.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_GTM_CONTAINER_ID: ${{ vars.NEXT_PUBLIC_GTM_CONTAINER_ID }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/out --project-name=lunssi
